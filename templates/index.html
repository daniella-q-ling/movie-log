{% extends "base.html" %}

{% block content %}

<h1>Mochiroll</h1>
<p>A cozy little space to log the movies you watch, rate and review your favorites, and discover your personal movie taste.</p>

<form action="{{ url_for('search') }}" method="get">
    <input type="text" name="q" placeholder="Search for a movie..." required>
    <button type="submit">Search</button>
</form>

{% endblock %}
